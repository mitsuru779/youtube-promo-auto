name: YouTube Info Cards Auto Placer Cloud

on:
  schedule:
    - cron: '0 */3 * * *' # Run every 3 hours
  workflow_dispatch: # Manual trigger

jobs:
  place-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Playwright Browsers
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Auto Card Placer Script
        run: |
          node scratch/github_actions_card_placer.mjs

      - name: Commit and Push Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/card_progress_auto.json
          git status
          git commit -m "Auto update: Info cards placement progress [skip ci]" || echo "No changes to commit"
          git push
