name: Automated Multi-Language Dubbing (12 Languages)

on:
  push:
    branches:
      - main
  schedule:
    # Runs automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of videos to process in this run'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  dub_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pydub yt-dlp youtube-transcript-api

      - name: Execute Cloud Dubbing Batch
        run: |
          python -c "
          import json, os, sys
          from manage_dubbing_queue import get_next_unprocessed_batch, mark_completed
          from cloud_multi_lang_dubber import process_video_dubbing, LANGUAGE_CONFIG

          # Process up to 3 videos per run
          batch = get_next_unprocessed_batch(3)
          if not batch:
              print('All videos and languages are completed!')
              sys.exit(0)

          for video_id, missing_langs in batch:
              print(f'=== Cloud Processing Video: {video_id} for {len(missing_langs)} languages ===')
              target_langs = [l for l in missing_langs if l in LANGUAGE_CONFIG]
              generated_files = process_video_dubbing(video_id, target_langs)
              
              for lang in generated_files.keys():
                  mark_completed(video_id, lang)

              # Cleanup mp3 files from disk
              for fpath in generated_files.values():
                  if os.path.exists(fpath):
                      os.remove(fpath)
          "

      - name: Commit and Push Updated Progress Matrix
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dubbing_matrix.json
          git commit -m "Cloud Auto-Dubbing Progress Update [skip ci]" || echo "No changes to commit"
          git push
