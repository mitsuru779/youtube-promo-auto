name: YouTube & Social Promo Automation

on:
  schedule:
    # Runs every 3 hours (at 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  promote:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic

      - name: Install Python Dependencies & Browsers
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore Auth Session State
        env:
          AUTH_STATE_BASE64: ${{ secrets.AUTH_STATE_BASE64 }}
        run: |
          if [ -n "$AUTH_STATE_BASE64" ]; then
            echo "$AUTH_STATE_BASE64" | base64 --decode > auth_state.json
            echo "Successfully restored auth_state.json from secret."
          fi

      - name: Run Promo Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          python promo_manager_cloud.py

      - name: Commit & Push Updated Promotion State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add promo_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update promo rotation state [skip ci]"
          git push
